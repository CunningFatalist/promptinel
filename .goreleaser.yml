version: 2

project_name: promptinel

before:
  hooks:
    - go mod tidy

builds:
  - id: promptinel
    main: ./main.go
    binary: promptinel
    flags:
      - -mod=mod
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/CunningFatalist/promptinel/cmd.Version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

changelog:
  sort: asc
