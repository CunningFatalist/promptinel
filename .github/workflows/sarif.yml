name: SARIF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  sarif:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.0"
        cache: true

    - name: Tidy and vendor modules
      run: |
        go mod tidy
        go mod vendor

    - name: Generate SARIF
      run: |
        go run -buildvcs=false main.go scan \
          --config e2e/testdata/promptinel.yaml \
          --no-config-discovery \
          --output sarif \
          e2e/testdata/sarif-clean > promptinel.sarif

    - name: Validate SARIF payload
      run: |
        jq -e '
          .version == "2.1.0"
          and ."$schema" == "https://json.schemastore.org/sarif-2.1.0.json"
          and (.runs | type == "array" and length > 0)
          and (.runs[0].tool.driver.name == "promptinel")
          and (.runs[0].results | type == "array")
        ' promptinel.sarif > /dev/null

    - name: Upload SARIF artifact
      uses: actions/upload-artifact@v4
      with:
        name: promptinel-sarif
        path: promptinel.sarif

    - name: Upload SARIF to code scanning
      if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: promptinel.sarif
