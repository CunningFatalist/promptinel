name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '^1.25.7'

    - name: Start Docker
      run: make setup

    - name: Test Docker
      run: make test-docker

    - name: Test Go
      run: make test

    - name: Lint
      run: make lint

    - name: Vet
      run: make vet

    - name: Build
      env:
        BUILD_VERSION: ${{ github.sha }}
      run: make build
