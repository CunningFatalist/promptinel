name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true

      - name: Tidy and vendor modules
        run: |
          go mod tidy
          go mod vendor

      - name: Test Go (core only)
        run: |
          pkgs="$(go list -buildvcs=false ./... | grep -v '/e2e$')"
          test -n "${pkgs}"
          go test ${pkgs} --cover --short --race --shuffle=on --parallel=3

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0

      - name: Vet
        run: go vet ./...

      - name: Dependency vulnerability audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Build
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: go build -buildvcs=false -ldflags="-X 'github.com/CunningFatalist/promptinel/cmd.Version=${BUILD_VERSION}'" -o build/promptinel main.go
