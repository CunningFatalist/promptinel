name: Feature request
description: Propose a new capability or improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem_statement
    attributes:
      label: Problem statement
      description: Describe the problem this feature should solve.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe the expected behavior or API.
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives considered
      description: Describe alternative solutions you considered.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context (optional)
      description: Add constraints, examples, or references.
    validations:
      required: false
